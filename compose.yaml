services:
  backend:
    build: ../mediaBridge
    ports:
      - "8081:80"
    depends_on:
      - mysql
      - redis
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      MYSQL_HOST: mysql
      MYSQL_DATABASE: mediaBridge
      MYSQL_USER: mediaTest
      MYSQL_PASSWORD: Test123.
      APP_ENV: dev
      DATABASE_URL: "mysql://mediaTest:Test123.@mysql:3306/mediaBridge?serverVersion=8.0&charset=utf8mb4"

  mysql:
    image: mariadb:11
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: mediaBridge
      MYSQL_USER: mediaTest
      MYSQL_PASSWORD: Test123.
    container_name: mediabridge_mysql

  redis:
    image: redis:7
    container_name: mediabridge_redis

  rabbitmq:
    image: rabbitmq:3-management
    container_name: mediabridge_rabbitmq
    ports:
      - "5672:5672"    # AMQP
      - "15672:15672"  # Panel web
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest