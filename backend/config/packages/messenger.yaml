framework:
    messenger:
        default_bus: messenger.bus.default
        transports:
            async:
                dsn: "doctrine://default?queue_name=async"
                retry_strategy:
                    max_retries: 3
                    delay: 1000
                    multiplier: 2
            tmdb_sync: 
                dsn: "doctrine://default?queue_name=tmdb_sync"
                retry_strategy:
                    max_retries: 3
                    delay: 5000
                    multiplier: 2
                    max_delay: 60000

            failed:
                dsn: "doctrine://default?queue_name=failed"

        routing:
            App\Application\Messenger\Statistics\Message\PageVisitedMessage: async
            App\Application\Messenger\Media\Message\SyncShowsFromCacheMessage: tmdb_sync
            App\Application\Messenger\Media\Message\SyncMoviesFromCacheMessage: tmdb_sync
