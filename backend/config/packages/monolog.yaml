monolog:
    channels:
        - deprecation # Deprecations are logged in the dedicated "deprecation" channel when it exists
        - api_error # Used directly from services if external api has failed
        - sentry # Used for automatic sentry exceptions
        - messenger # Used for errors caused by messenger handler
        - cache # Used to silence noisy cache heartbeat logs (e.g. zenstruck/messenger-monitor)

when@dev:
    monolog:
        handlers:
            main:
                type: stream
                path: "%kernel.logs_dir%/%kernel.environment%.log"
                level: debug
                channels: ["!event", "!cache"]
                max_files: 10
            console:
                type: console
                process_psr_3_messages: false
                channels: ["!event", "!doctrine", "!console", "!cache"]
            api_error:
                type: fingers_crossed
                action_level: error
                handler: api
                channels: ["api_error"]

            api:
                type: stream
                path: "%kernel.logs_dir%/api/%kernel.environment%.api_error.log"
                level: error

            sentry:
                type: stream
                path: "%kernel.logs_dir%/sentry/%kernel.environment%.sentry_error.log"
                level: error
                bubble: true
                channels: ['sentry', 'messenger']
            messenger:
                type: stream
                path: "%kernel.logs_dir%/messenger/%kernel.environment%.messenger_error.log"
                level: error
                channels: ["messenger"]
            cache:
                type: stream
                path: "%kernel.logs_dir%/cache/%kernel.environment%.cache.log"
                level: warning
                channels: ["cache"]

when@test:
    monolog:
        handlers:
            main:
                type: fingers_crossed
                action_level: error
                handler: nested
                excluded_http_codes: [404, 405]
                channels: ["!event"]
            nested:
                type: stream
                path: "%kernel.logs_dir%/%kernel.environment%.log"
                level: debug

when@prod:
    monolog:
        handlers:
            main:
                type: fingers_crossed
                action_level: error
                handler: nested
                excluded_http_codes: [404, 405]
                channels: ["!deprecation"]
                buffer_size: 50 # How many messages should be saved? Prevent memory leaks
            nested:
                type: stream
                path: php://stderr
                level: debug
                formatter: monolog.formatter.json
            console:
                type: console
                process_psr_3_messages: false
                channels: ["!event", "!doctrine"]
            deprecation:
                type: stream
                channels: [deprecation]
                path: php://stderr
                formatter: monolog.formatter.json